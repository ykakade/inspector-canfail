<svg xmlns="http://www.w3.org/2000/svg" width="760" height="264" viewBox="0 0 760 264" role="img" aria-labelledby="title desc">
  <title id="title">A test that notices</title>
  <desc id="desc">A red pen strikes the equals sign from amount greater than or equal to 50. The test shipping(50) fails: expected 0, received 5. An italic note says this test noticed.</desc>
  <rect width="760" height="264" rx="4" fill="#f8f6f0"/>
  <g fill="#292923">
    <g font-family="'Liberation Sans', Arial, sans-serif" font-size="11" letter-spacing="1.6">
      <text x="48" y="55">CHANGE ONE BOUNDARY</text>
      <text x="420" y="55">RUN THE TEST</text>
    </g>
    <g font-family="'Liberation Mono', Consolas, monospace" font-size="20">
      <text x="48" y="114">return amount &gt;= 50</text>
      <text x="48" y="145">  ? 0 : 5;</text>
    </g>
    <g font-family="'Liberation Mono', Consolas, monospace" font-size="17">
      <text x="420" y="104">expect(shipping(50))</text>
      <text x="420" y="131">  .toBe(0)</text>
      <text x="448" y="175" fill="#68685d">Expected 0</text>
      <text x="448" y="201" fill="#ad4438">Received 5</text>
    </g>
  </g>
  <g fill="none" stroke="#ad4438" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- The equals sign is centered at x=234. Remove it, leaving a strict comparison. -->
    <path d="M226 117 L242 97 M226 98 L242 117"/>
    <path d="M234 82 C248 65 273 67 284 73"/>
    <!-- One pen stroke leads from the source edit to the failed assertion. -->
    <path d="M298 136 C321 153 356 152 386 132 M376 131 L388 130 L385 142"/>
    <path d="M421 188 L433 200 M433 187 L421 201"/>
    <path d="M461 238 C503 241 567 239 597 235" stroke-width="1.3"/>
  </g>
  <g fill="#ad4438" font-family="'Liberation Serif', Georgia, serif" font-style="italic">
    <text x="286" y="81" font-size="18" transform="rotate(-5 286 81)">break it</text>
    <text x="455" y="232" font-size="23" transform="rotate(-3 455 232)">this test noticed.</text>
  </g>
</svg>
